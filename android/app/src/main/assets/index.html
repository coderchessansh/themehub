<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>ThemeHub</title><style>body{margin:0;background:#0f172a;color:white;font-family:Arial,sans-serif;text-align:center;padding:24px}main{max-width:700px;margin:auto}.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:20px;padding:22px;margin:16px 0}button{background:#5865f2;color:white;border:0;border-radius:12px;padding:13px 18px;margin:5px;font-weight:bold}input,select{padding:12px;border-radius:10px;border:1px solid #aaa;font-size:16px;max-width:100%}label{display:block;margin:14px;font-weight:bold}input[type=color]{width:70px;height:45px}.preview{padding:25px;border-radius:16px;background:#ffffff12;margin-top:16px}</style></head><body><main><h1>🎨 ThemeHub</h1><p>ThemeHub Android — your themes, on your phone.</p><div class="card"><h2>Theme Builder</h2><label>Background<br><input id="bg" type="color" value="#0f172a"></label><label>Text<br><input id="text" type="color" value="#ffffff"></label><label>Accent<br><input id="accent" type="color" value="#5865f2"></label><label>Font<br><select id="font"><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Courier New</option><option>Inter</option><option>Roboto</option><option>Poppins</option><option>Montserrat</option><option>Open Sans</option><option>Nunito</option></select></label><button onclick="apply()">✨ Apply</button></div><div class="card"><h2>✨ Presets</h2><button onclick="p('#313338','#fff','#5865f2','Inter')">🟣 Discord</button><button onclick="p('#000','#0f0','#0a0','Courier New')">🟢 Matrix</button><button onclick="p('#082f49','#e0f2fe','#06b6d4','Nunito')">🌊 Ocean</button><button onclick="p('#431407','#fff7ed','#f97316','Montserrat')">🌅 Sunset</button><button onclick="p('#052e16','#dcfce7','#22c55e','Lato')">🌲 Forest</button></div><div class="card"><h2>👀 Preview</h2><div class="preview"><h2>ThemeHub</h2><p>Your selected theme appears here.</p><button>Example Button</button></div></div></main><script>const $=x=>document.getElementById(x);function apply(){document.body.style.background=$("bg").value;document.body.style.color=$("text").value;document.body.style.fontFamily=$("font").value;document.documentElement.style.setProperty('--a',$("accent").value);document.querySelectorAll('button').forEach(b=>b.style.background=$("accent").value);localStorage.theme=JSON.stringify({bg:$("bg").value,text:$("text").value,accent:$("accent").value,font:$("font").value})}function p(bg,text,accent,font){$("bg").value=bg;$("text").value=text;$("accent").value=accent;$("font").value=font;apply()}onload=()=>{try{let t=JSON.parse(localStorage.theme);p(t.bg,t.text,t.accent,t.font)}catch(e){apply()}}</script></body></html>
