name: Build ThemeHub iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/ThemeHub.xcodeproj \
            -target ThemeHub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -r ThemeHub-iOS-Simulator.zip ThemeHub.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ThemeHub-iOS-Simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/ThemeHub-iOS-Simulator.zip
          if-no-files-found: error