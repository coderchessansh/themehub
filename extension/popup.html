<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThemeHub</title><style>body{width:300px;margin:0;padding:16px;font-family:Arial,sans-serif;background:#0f172a;color:#fff}h2{margin-top:0}label{display:block;margin:10px 0;font-weight:bold}input,select{width:100%;padding:8px;margin-top:5px;box-sizing:border-box}button{width:100%;padding:10px;margin-top:12px;border:0;border-radius:9px;background:#5865f2;color:#fff;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px}.row label{flex:1}.status{margin-top:10px;opacity:.75;font-size:12px}</style></head><body><h2>🎨 ThemeHub</h2><label>Background<input id="bg" type="color" value="#0f172a"></label><label>Text<input id="text" type="color" value="#ffffff"></label><label>Accent<input id="accent" type="color" value="#5865f2"></label><label>Font<select id="font"><option>Inter, sans-serif</option><option>Roboto, sans-serif</option><option>Poppins, sans-serif</option><option>Montserrat, sans-serif</option><option>Open Sans, sans-serif</option><option>Nunito, sans-serif</option><option>Ubuntu, sans-serif</option><option>Georgia, serif</option><option>Fira Code, monospace</option></select></label><button id="apply">✨ Apply to this site</button><button id="off">↩️ Turn off</button><div class="status" id="status">ThemeHub extension</div><script src="popup.js"></script></body></html>
