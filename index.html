<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ThemeHub V2.3</title>
<style>
:root{--accent:#5865f2}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:20px;text-align:center;transition:.3s;min-height:100vh}.container{max-width:900px;margin:auto}h1{font-size:clamp(2rem,6vw,3rem)}.card{background:rgba(255,255,255,.08);padding:20px;margin:15px 0;border-radius:20px;border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.18)}button{padding:12px 20px;margin:5px;border:0;border-radius:12px;cursor:pointer;font-weight:bold;background:var(--accent);color:#fff;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}input[type=color]{width:80px;height:50px;border:0;cursor:pointer;background:none}input[type=text],select{padding:12px;border-radius:10px;border:1px solid #aaa;max-width:100%;font-size:16px}select{min-width:220px}label{display:block;margin:12px;font-weight:bold}.preview{padding:25px;border-radius:16px;margin-top:10px;background:rgba(255,255,255,.08)}#themeList{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.small{opacity:.75;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
<h1>🎨 ThemeHub V2.3</h1><p>Create, save, export and share your own themes!</p>
<div class="card"><h2>🛠️ Theme Builder</h2>
<label>Theme Name<br><input type="text" id="themeName" placeholder="My Awesome Theme"></label>
<label>Background Color<br><input type="color" id="bg" value="#0f172a"></label>
<label>Text Color<br><input type="color" id="text" value="#ffffff"></label>
<label>Accent Color<br><input type="color" id="accent" value="#5865f2"></label>
<label>Font<br><select id="font"><option value="Arial, sans-serif">Arial</option><option value="Verdana, sans-serif">Verdana</option><option value="Tahoma, sans-serif">Tahoma</option><option value="Trebuchet MS, sans-serif">Trebuchet MS</option><option value="Georgia, serif">Georgia</option><option value="Times New Roman, serif">Times New Roman</option><option value="Courier New, monospace">Courier New</option><option value="Impact, sans-serif">Impact</option></select></label>
<button onclick="saveTheme()">💾 Save Theme</button><button onclick="exportTheme()">📤 Export Theme</button><input type="file" id="importFile" accept=".json"><button onclick="importTheme()">📥 Import Theme</button></div>
<div class="card"><h2>✨ Preset Themes</h2><button onclick="preset('#313338','#ffffff','#5865f2','Arial, sans-serif')">🟣 Discord</button><button onclick="preset('#111111','#ffffff','#6666ff','Verdana, sans-serif')">🌑 Dark</button><button onclick="preset('#ffffff','#000000','#5865f2','Arial, sans-serif')">☀️ Light</button><button onclick="preset('#000000','#00ff00','#00aa00','Courier New, monospace')">🟢 Matrix</button><button onclick="preset('#ffb6c1','#4a004a','#d63384','Georgia, serif')">🌸 Pink</button></div>
<div class="card"><h2>👀 Live Preview</h2><div class="preview"><p>This is preview text using your selected font and colors.</p><button>Example Button</button></div></div>
<div class="card"><h2>📚 Saved Themes</h2><div id="themeList"></div><p class="small">Themes are saved in your browser using local storage.</p></div>
</div>
<script>
const $=id=>document.getElementById(id);
function getTheme(){return{name:$("themeName").value,bg:$("bg").value,text:$("text").value,accent:$("accent").value,font:$("font").value}}
function applyTheme(){document.body.style.backgroundColor=$("bg").value;document.body.style.color=$("text").value;document.body.style.fontFamily=$("font").value;document.documentElement.style.setProperty('--accent',$("accent").value);}
function loadTheme(t){$("themeName").value=t.name||'';$("bg").value=t.bg||'#0f172a';$("text").value=t.text||'#fff';$("accent").value=t.accent||'#5865f2';$("font").value=t.font||'Arial, sans-serif';applyTheme()}
function saveTheme(){let t=JSON.parse(localStorage.getItem('themes')||'[]');t.push(getTheme());localStorage.setItem('themes',JSON.stringify(t));renderThemes();alert('Theme Saved!')}
function exportTheme(){let t=getTheme(),blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(t.name||'theme')+'.json';a.click()}
function importTheme(){let f=$("importFile").files[0];if(!f)return alert('Choose a theme JSON file first!');let r=new FileReader();r.onload=()=>{try{loadTheme(JSON.parse(r.result))}catch(e){alert('Invalid theme file!')}};r.readAsText(f)}
function renderThemes(){let c=$("themeList"),t=JSON.parse(localStorage.getItem('themes')||'[]');c.innerHTML='';t.forEach((theme,i)=>{let b=document.createElement('button');b.textContent=theme.name||'Theme '+(i+1);b.onclick=()=>loadTheme(theme);let d=document.createElement('button');d.textContent='🗑️';d.onclick=()=>{t.splice(i,1);localStorage.setItem('themes',JSON.stringify(t));renderThemes()};c.append(b,d)})}
function preset(bg,text,accent,font){loadTheme({bg,text,accent,font})}
['bg','text','accent','font'].forEach(id=>$(id).addEventListener('input',applyTheme));
window.onload=()=>{let s=localStorage.getItem('themehubCurrent');if(s)try{loadTheme(JSON.parse(s))}catch(e){}renderThemes();applyTheme()};
window.addEventListener('beforeunload',()=>localStorage.setItem('themehubCurrent',JSON.stringify(getTheme())));
</script>
</body></html>
