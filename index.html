<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ThemeHub V2.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&family=Raleway:wght@400;600;700&family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#5865f2}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:20px;text-align:center;transition:.3s;min-height:100vh}.container{max-width:900px;margin:auto}h1{font-size:clamp(2rem,6vw,3rem)}.card{background:rgba(255,255,255,.08);padding:20px;margin:15px 0;border-radius:20px;border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.18)}button{padding:12px 20px;margin:5px;border:0;border-radius:12px;cursor:pointer;font-weight:bold;background:var(--accent);color:#fff;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}input[type=color]{width:80px;height:50px;border:0;cursor:pointer;background:none}input[type=text],select{padding:12px;border-radius:10px;border:1px solid #aaa;max-width:100%;font-size:16px}select{min-width:260px}label{display:block;margin:12px;font-weight:bold}.preview{padding:25px;border-radius:16px;margin-top:10px;background:rgba(255,255,255,.08)}#themeList{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.small{opacity:.75;font-size:.9rem}.font-note{opacity:.7;font-size:.85rem}.preset-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
</style></head>
<body><div class="container">
<h1>🎨 ThemeHub V2.5</h1><p>Create, save, export and share your own themes!</p>
<div class="card"><h2>🛠️ Theme Builder</h2>
<label>Theme Name<br><input type="text" id="themeName" placeholder="My Awesome Theme"></label>
<label>Background Color<br><input type="color" id="bg" value="#0f172a"></label>
<label>Text Color<br><input type="color" id="text" value="#ffffff"></label>
<label>Accent Color<br><input type="color" id="accent" value="#5865f2"></label>
<label>Font<br><select id="font"><option value="Arial, sans-serif">Arial</option><option value="Verdana, sans-serif">Verdana</option><option value="Tahoma, sans-serif">Tahoma</option><option value="'Trebuchet MS', sans-serif">Trebuchet MS</option><option value="Georgia, serif">Georgia</option><option value="'Times New Roman', serif">Times New Roman</option><option value="'Courier New', monospace">Courier New</option><option value="Impact, sans-serif">Impact</option><option value="Inter, sans-serif">Inter</option><option value="Roboto, sans-serif">Roboto</option><option value="Poppins, sans-serif">Poppins</option><option value="Montserrat, sans-serif">Montserrat</option><option value="Open Sans, sans-serif">Open Sans</option><option value="Lato, sans-serif">Lato</option><option value="Nunito, sans-serif">Nunito</option><option value="Ubuntu, sans-serif">Ubuntu</option><option value="Raleway, sans-serif">Raleway</option><option value="Oswald, sans-serif">Oswald</option><option value="Playfair Display, serif">Playfair Display</option><option value="Merriweather, serif">Merriweather</option><option value="Roboto Slab, serif">Roboto Slab</option><option value="Fira Code, monospace">Fira Code</option></select><div class="font-note">Google Fonts load automatically when you're online.</div></label>
<button onclick="saveTheme()">💾 Save Theme</button><button onclick="exportTheme()">📤 Export Theme</button><input type="file" id="importFile" accept=".json"><button onclick="importTheme()">📥 Import Theme</button></div>
<div class="card"><h2>✨ Preset Themes</h2><div class="preset-grid">
<button onclick="preset('Discord','#313338','#ffffff','#5865f2','Inter, sans-serif')">🟣 Discord</button><button onclick="preset('Midnight','#111111','#ffffff','#6666ff','Montserrat, sans-serif')">🌑 Midnight</button><button onclick="preset('Light','#ffffff','#000000','#5865f2','Open Sans, sans-serif')">☀️ Light</button><button onclick="preset('Matrix','#000000','#00ff00','#00aa00','Fira Code, monospace')">🟢 Matrix</button><button onclick="preset('Pink Blossom','#ffb6c1','#4a004a','#d63384','Poppins, sans-serif')">🌸 Pink</button><button onclick="preset('Ocean','#082f49','#e0f2fe','#06b6d4','Nunito, sans-serif')">🌊 Ocean</button><button onclick="preset('Sunset','#431407','#fff7ed','#f97316','Montserrat, sans-serif')">🌅 Sunset</button><button onclick="preset('Forest','#052e16','#dcfce7','#22c55e','Lato, sans-serif')">🌲 Forest</button><button onclick="preset('Lavender','#2e1065','#f5f3ff','#a855f7','Raleway, sans-serif')">💜 Lavender</button><button onclick="preset('Cherry','#450a0a','#fee2e2','#ef4444','Roboto, sans-serif')">🍒 Cherry</button><button onclick="preset('Coffee','#29180f','#fef3c7','#d97706','Merriweather, serif')">☕ Coffee</button><button onclick="preset('Cyberpunk','#120024','#fdf4ff','#e879f9','Oswald, sans-serif')">⚡ Cyberpunk</button><button onclick="preset('Sky','#0c4a6e','#f0f9ff','#38bdf8','Roboto, sans-serif')">☁️ Sky</button><button onclick="preset('Rose Gold','#4c0519','#fff1f2','#fb7185','Playfair Display, serif')">🌹 Rose Gold</button><button onclick="preset('Monochrome','#202020','#f5f5f5','#737373','Arial, sans-serif')">⚫ Monochrome</button><button onclick="preset('Emerald','#022c22','#ecfdf5','#10b981','Ubuntu, sans-serif')">💎 Emerald</button><button onclick="preset('Royal','#172554','#eff6ff','#3b82f6','Georgia, serif')">👑 Royal</button><button onclick="preset('Neon','#050505','#ffffff','#39ff14','Fira Code, monospace')">💚 Neon</button>
</div></div>
<div class="card"><h2>👀 Live Preview</h2><div class="preview"><h3>ThemeHub Preview</h3><p>This text changes with your selected font and colors.</p><button>Example Button</button></div></div>
<div class="card"><h2>📚 Saved Themes</h2><div id="themeList"></div><p class="small">Themes are saved in your browser using local storage.</p></div>
</div><script>
const $=id=>document.getElementById(id);function getTheme(){return{name:$("themeName").value,bg:$("bg").value,text:$("text").value,accent:$("accent").value,font:$("font").value}}function applyTheme(){document.body.style.backgroundColor=$("bg").value;document.body.style.color=$("text").value;document.body.style.fontFamily=$("font").value;document.documentElement.style.setProperty('--accent',$("accent").value)}function loadTheme(t){$("themeName").value=t.name||'';$("bg").value=t.bg||'#0f172a';$("text").value=t.text||'#fff';$("accent").value=t.accent||'#5865f2';$("font").value=t.font||'Arial, sans-serif';applyTheme()}function saveTheme(){let t=JSON.parse(localStorage.getItem('themes')||'[]');t.push(getTheme());localStorage.setItem('themes',JSON.stringify(t));renderThemes();alert('Theme Saved!')}function exportTheme(){let t=getTheme(),blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(t.name||'theme')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importTheme(){let f=$("importFile").files[0];if(!f)return alert('Choose a theme JSON file first!');let r=new FileReader();r.onload=()=>{try{loadTheme(JSON.parse(r.result))}catch(e){alert('Invalid theme file!')}};r.readAsText(f)}function renderThemes(){let c=$("themeList"),t=JSON.parse(localStorage.getItem('themes')||'[]');c.innerHTML='';t.forEach((theme,i)=>{let b=document.createElement('button');b.textContent=theme.name||'Theme '+(i+1);b.onclick=()=>loadTheme(theme);let d=document.createElement('button');d.textContent='🗑️';d.onclick=()=>{t.splice(i,1);localStorage.setItem('themes',JSON.stringify(t));renderThemes()};c.append(b,d)})}function preset(name,bg,text,accent,font){loadTheme({name,bg,text,accent,font})}['bg','text','accent','font'].forEach(id=>$(id).addEventListener('input',applyTheme));window.onload=()=>{let s=localStorage.getItem('themehubCurrent');if(s)try{loadTheme(JSON.parse(s))}catch(e){}renderThemes();applyTheme()};window.addEventListener('beforeunload',()=>localStorage.setItem('themehubCurrent',JSON.stringify(getTheme())));
</script></body></html>
