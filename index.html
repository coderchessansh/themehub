<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThemeHub V3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&family=Raleway:wght@400;600;700&family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet"><style>:root{--a:#5865f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#0f172a;color:#fff;font-family:Inter,sans-serif;text-align:center;transition:.25s}.wrap{max-width:920px;margin:auto}.card{padding:20px;margin:15px 0;border-radius:20px;background:#ffffff12;border:1px solid #ffffff2b;box-shadow:0 10px 30px #0003}button{padding:12px 18px;margin:5px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:700;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}input,select{padding:11px;border-radius:10px;border:1px solid #aaa;font-size:16px;max-width:100%}input[type=color]{width:75px;height:45px;padding:2px}label{display:block;margin:12px;font-weight:700}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.preview{padding:25px;border-radius:16px;margin-top:10px;background:#ffffff12}.muted{opacity:.7;font-size:.9rem}.danger{background:#b91c1c}</style></head><body><div class="wrap"><h1>🎨 ThemeHub V3</h1><p>Build, save, import, export and use your themes.</p><div class="card"><h2>🛠️ Theme Builder</h2><label>Theme Name<br><input id="name" placeholder="My Awesome Theme"></label><label>Background<br><input id="bg" type="color" value="#0f172a"></label><label>Text<br><input id="text" type="color" value="#ffffff"></label><label>Accent<br><input id="accent" type="color" value="#5865f2"></label><label>Font<br><select id="font"><option>Arial, sans-serif</option><option>Verdana, sans-serif</option><option>Tahoma, sans-serif</option><option>Georgia, serif</option><option>Times New Roman, serif</option><option>Courier New, monospace</option><option>Impact, sans-serif</option><option>Inter, sans-serif</option><option>Roboto, sans-serif</option><option>Poppins, sans-serif</option><option>Montserrat, sans-serif</option><option>Open Sans, sans-serif</option><option>Lato, sans-serif</option><option>Nunito, sans-serif</option><option>Ubuntu, sans-serif</option><option>Raleway, sans-serif</option><option>Oswald, sans-serif</option><option>Playfair Display, serif</option><option>Merriweather, serif</option><option>Roboto Slab, serif</option><option>Fira Code, monospace</option></select></label><button onclick="saveTheme()">💾 Save</button><button onclick="exportTheme()">📤 Export</button><button onclick="importTheme()">📥 Import</button><input id="file" type="file" accept="application/json,.json" hidden><button id="browserBtn" onclick="openBrowser()" style="display:none">🌐 Theme Web Pages</button><p class="muted">Fonts from Google Fonts work when online.</p></div><div class="card"><h2>✨ Presets</h2><div class="grid" id="presets"></div></div><div class="card"><h2>👀 Live Preview</h2><div class="preview"><h2>ThemeHub Preview</h2><p>Your selected colors and font appear here.</p><button>Example Button</button></div></div><div class="card"><h2>📚 Saved Themes</h2><div class="grid" id="saved"></div></div></div><script>const $=id=>document.getElementById(id),AndroidAPI=window.Android;const presets=[['🟣 Discord','#313338','#fff','#5865f2','Inter, sans-serif'],['🌑 Midnight','#111','#fff','#6666ff','Montserrat, sans-serif'],['☀️ Light','#fff','#000','#5865f2','Open Sans, sans-serif'],['🟢 Matrix','#000','#0f0','#0a0','Fira Code, monospace'],['🌸 Pink','#ffb6c1','#4a004a','#d63384','Poppins, sans-serif'],['🌊 Ocean','#082f49','#e0f2fe','#06b6d4','Nunito, sans-serif'],['🌅 Sunset','#431407','#fff7ed','#f97316','Montserrat, sans-serif'],['🌲 Forest','#052e16','#dcfce7','#22c55e','Lato, sans-serif'],['💜 Lavender','#2e1065','#f5f3ff','#a855f7','Raleway, sans-serif'],['🍒 Cherry','#450a0a','#fee2e2','#ef4444','Roboto, sans-serif'],['☕ Coffee','#29180f','#fef3c7','#d97706','Merriweather, serif'],['⚡ Cyberpunk','#120024','#fdf4ff','#e879f9','Oswald, sans-serif'],['☁️ Sky','#0c4a6e','#f0f9ff','#38bdf8','Roboto, sans-serif'],['🌹 Rose Gold','#4c0519','#fff1f2','#fb7185','Playfair Display, serif'],['⚫ Mono','#202020','#f5f5f5','#737373','Arial, sans-serif'],['💎 Emerald','#022c22','#ecfdf5','#10b981','Ubuntu, sans-serif'],['👑 Royal','#172554','#eff6ff','#3b82f6','Georgia, serif'],['💚 Neon','#050505','#fff','#39ff14','Fira Code, monospace']];function theme(){return{name:$("name").value,bg:$("bg").value,text:$("text").value,accent:$("accent").value,font:$("font").value}}function apply(t=theme()){ $("name").value=t.name||'';$("bg").value=t.bg||'#0f172a';$("text").value=t.text||'#fff';$("accent").value=t.accent||'#5865f2';$("font").value=t.font||'Arial, sans-serif';document.body.style.backgroundColor=$("bg").value;document.body.style.color=$("text").value;document.body.style.fontFamily=$("font").value;document.documentElement.style.setProperty('--a',$("accent").value);if(AndroidAPI)AndroidAPI.saveTheme(JSON.stringify(theme()))}function saveTheme(){let a=JSON.parse(localStorage.getItem('themes')||'[]');a.push(theme());localStorage.setItem('themes',JSON.stringify(a));renderSaved()}function exportTheme(){let t=theme(),json=JSON.stringify(t,null,2);if(AndroidAPI&&AndroidAPI.exportThemeFile){AndroidAPI.exportThemeFile(json,t.name||'theme');return}let b=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(t.name||'theme')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importTheme(){if(AndroidAPI){AndroidAPI.openThemeFilePicker();return}$("file").click()}$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>importThemeFromAndroid(r.result);r.readAsText(f)}function importThemeFromAndroid(raw){try{let t=typeof raw==='string'?JSON.parse(raw):raw;apply(t);alert('Theme imported!')}catch(e){alert('Invalid theme file!')}}function renderSaved(){let c=$("saved");c.innerHTML='';JSON.parse(localStorage.getItem('themes')||'[]').forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.name||'Theme '+(i+1);b.onclick=()=>apply(t);let d=document.createElement('button');d.textContent='🗑️';d.className='danger';d.onclick=()=>{let a=JSON.parse(localStorage.getItem('themes')||'[]');a.splice(i,1);localStorage.setItem('themes',JSON.stringify(a));renderSaved()};c.append(b,d)})}function openBrowser(){if(AndroidAPI)AndroidAPI.openBrowser()}presets.forEach(p=>{let b=document.createElement('button');b.textContent=p[0];b.onclick=()=>apply({name:p[0],bg:p[1],text:p[2],accent:p[3],font:p[4]});$("presets").append(b)});['bg','text','accent','font'].forEach(id=>$(id).addEventListener('input',()=>apply()));if(AndroidAPI)$("browserBtn").style.display='inline-block';onload=()=>{let s=localStorage.getItem('themehubCurrent');if(s)try{apply(JSON.parse(s))}catch(e){}renderSaved();apply()};window.addEventListener('beforeunload',()=>localStorage.setItem('themehubCurrent',JSON.stringify(theme())))</script></body></html>
